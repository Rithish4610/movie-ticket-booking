<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies | Movie Ticket Booking</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #121212;
            color: #e0e0e0;
            margin: 0;
        }

        .container {
            max-width: 700px;
            margin: 60px auto;
            background: #1e1e1e;
            border-radius: 18px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
            padding: 40px 32px 32px 32px;
            border: 1px solid #333;
        }

        h2 {
            color: #F5C518;
            text-align: center;
            text-shadow: 0 0 10px rgba(245, 197, 24, 0.3);
        }

        .movie-list {
            margin-top: 30px;
        }

        .movie {
            background: #2c2c2c;
            border-radius: 10px;
            padding: 18px 24px;
            margin-bottom: 18px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            border: 1px solid #444;
        }

        .movie-title {
            font-size: 1.3em;
            color: #F5C518;
        }

        .movie-desc {
            color: #aaa;
            margin-top: 8px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Now in the BatVerse</h2>
        <div style="text-align:right; margin-bottom:18px;">
            <a href="/admin/add_movie"
                style="background:#F5C518; color:#000; padding:10px 22px; border-radius:8px; font-weight:bold; text-decoration:none; box-shadow:0 2px 8px rgba(245,197,24,0.4); transition:all 0.2s;">+
                Add Movie (Admin)</a>
        </div>
        <div class="movie-list">
            {% if dates %}
            <h3 style="color:#F5C518; text-align:center;">Select a Date</h3>
            {% for date in dates %}
            <div class="movie" style="text-align:center;">
                <a href="/movies/{{ date }}" style="font-size:1.1em; color:#F5C518; font-weight:bold;">{{ date }}</a>
            </div>
            {% endfor %}
            {% else %}
            <p>No shows available. Please check back later.</p>
            {% endif %}
        </div>
    </div>
</body>

</html>
