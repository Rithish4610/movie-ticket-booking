<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies | Movie Ticket Booking</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f6f8fc;
            color: #222;
            margin: 0;
        }
        .container {
            max-width: 700px;
            margin: 60px auto;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 4px 24px #b3c6e0aa;
            padding: 40px 32px 32px 32px;
        }
        h2 {
            color: #3b82f6;
            text-align: center;
        }
        .movie-list {
            margin-top: 30px;
        }
        .movie {
            background: #e3eaff;
            border-radius: 10px;
            padding: 18px 24px;
            margin-bottom: 18px;
            box-shadow: 0 2px 8px #b3c6e066;
        }
        .movie-title {
            font-size: 1.3em;
            color: #3b82f6;
        }
        .movie-desc {
            color: #7b8fa6;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Now Showing</h2>
        <div style="text-align:right; margin-bottom:18px;">
            <a href="/admin/add_movie" style="background:linear-gradient(90deg, #3b82f6 0%, #a7e9af 100%); color:#fff; padding:10px 22px; border-radius:8px; font-weight:bold; text-decoration:none; box-shadow:0 2px 8px #b3c6e066; transition:background 0.2s;">+ Add Movie (Admin)</a>
        </div>
        <div class="movie-list">
            {% if dates %}
                <h3 style="color:#3b82f6; text-align:center;">Select a Date</h3>
                {% for date in dates %}
                    <div class="movie" style="text-align:center;">
                        <a href="/movies/{{ date }}" style="font-size:1.1em; color:#3b82f6; font-weight:bold;">{{ date }}</a>
                    </div>
                {% endfor %}
            {% else %}
                <p>No shows available. Please check back later.</p>
            {% endif %}
        </div>
    </div>
</body>
</html>
