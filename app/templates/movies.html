<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies | Movie Ticket Booking</title>
    <style>
        body { font-family: Arial, sans-serif; background: #181c24; color: #fff; margin: 0; }
        .container { max-width: 700px; margin: 60px auto; background: #232a34; border-radius: 12px; box-shadow: 0 4px 24px #0003; padding: 32px; }
        h2 { color: #ffb347; text-align: center; }
        .movie-list { margin-top: 30px; }
        .movie { background: #2d3642; border-radius: 8px; padding: 18px 24px; margin-bottom: 18px; }
        .movie-title { font-size: 1.3em; color: #ffb347; }
        .movie-desc { color: #ccc; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Now Showing</h2>
        <div class="movie-list">
            {% if dates %}
                <h3 style="color:#b3e6ff; text-align:center;">Select a Date</h3>
                {% for date in dates %}
                    <div class="movie" style="background:#232a34; text-align:center;">
                        <a href="/movies/{{ date }}" style="font-size:1.1em; color:#ffb347; font-weight:bold;">{{ date }}</a>
                    </div>
                {% endfor %}
            {% else %}
                <p>No shows available. Please check back later.</p>
            {% endif %}
        </div>
    </div>
</body>
</html>
