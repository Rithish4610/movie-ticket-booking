<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | Movie Ticket Booking</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f6f8fc;
            color: #222;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 80px auto;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 4px 24px #b3c6e0aa;
            padding: 48px 40px 40px 40px;
            text-align: center;
        }
        h1 {
            color: #3b82f6;
        }
        p {
            color: #7b8fa6;
        }
        .cta {
            margin-top: 30px;
        }
        .cta a {
            background: linear-gradient(90deg, #3b82f6 0%, #a7e9af 100%);
            color: #fff;
            text-decoration: none;
            padding: 12px 32px;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.2s;
            box-shadow: 0 2px 8px #b3c6e066;
        }
        .cta a:hover {
            background: linear-gradient(90deg, #2563eb 0%, #7ed957 100%);
        }
    </style>
</head>
<body>
    <div class="container">
        {% block content %}
        <h1>Welcome to the Online Movie Ticket Booking System!</h1>
        <p>Book your favorite movies, choose your seats, and enjoy the show. Fast, easy, and secure.</p>
        <div class="cta">
            <a href="/movies">View Movies & Book Now</a>
        </div>
        {% endblock %}
    </div>
</body>
</html>
