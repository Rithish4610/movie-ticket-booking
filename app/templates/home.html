<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | Movie Ticket Booking</title>
    <style>
        body { font-family: Arial, sans-serif; background: #181c24; color: #fff; margin: 0; }
        .container { max-width: 600px; margin: 80px auto; background: #232a34; border-radius: 12px; box-shadow: 0 4px 24px #0003; padding: 40px; text-align: center; }
        h1 { color: #ffb347; }
        p { color: #ccc; }
        .cta { margin-top: 30px; }
        .cta a { background: #ffb347; color: #232a34; text-decoration: none; padding: 12px 32px; border-radius: 6px; font-weight: bold; transition: background 0.2s; }
        .cta a:hover { background: #ff8800; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to the Online Movie Ticket Booking System!</h1>
        <p>Book your favorite movies, choose your seats, and enjoy the show. Fast, easy, and secure.</p>
        <div class="cta">
            <a href="#">View Movies & Book Now</a>
        </div>
    </div>
</body>
</html>
