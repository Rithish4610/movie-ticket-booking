<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | Movie Ticket Booking</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #121212;
            color: #e0e0e0;
            margin: 0;
        }

        .container {
            max-width: 600px;
            margin: 80px auto;
            background: #1e1e1e;
            border-radius: 18px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
            padding: 48px 40px 40px 40px;
            text-align: center;
            border: 1px solid #333;
        }

        h1 {
            color: #F5C518;
            text-shadow: 0 0 10px rgba(245, 197, 24, 0.3);
        }

        p {
            color: #aaa;
        }

        .cta {
            margin-top: 30px;
        }

        .cta a {
            background: #F5C518;
            color: #000;
            text-decoration: none;
            padding: 12px 32px;
            border-radius: 8px;
            font-weight: bold;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(245, 197, 24, 0.4);
            display: inline-block;
        }

        .cta a:hover {
            background: #ffd700;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(245, 197, 24, 0.6);
            color: #000;
        }
    </style>
</head>

<body>
    <div class="container">
        {% block content %}
        <h1>Welcome to the Online Movie Ticket Booking System!</h1>
        <p>Book your favorite movies, choose your seats, and enjoy the show. Fast, easy, and secure.</p>
        <div class="cta">
            <a href="/movies">View Movies & Book Now</a>
        </div>
        {% endblock %}
    </div>
</body>

</html>
