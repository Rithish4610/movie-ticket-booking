<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BatVerse Cinema | Ticket Booking</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&display=swap');

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
            color: #e0e0e0;
            margin: 0;
            min-height: 100vh;
        }

        .container {
            max-width: 650px;
            margin: 80px auto;
            background: #1e1e1e;
            border-radius: 18px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.8);
            padding: 50px 40px;
            text-align: center;
            border: 1px solid #333;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, #ffd700, #F5C518, #ffd700);
        }

        h1 {
            display: none;
            /* Hide original h1 */
        }

        .logo-container {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .bat-logo {
            width: 120px;
            height: auto;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 10px rgba(245, 197, 24, 0.4));
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        .brand-text {
            display: flex;
            flex-direction: column;
            line-height: 1;
        }

        .brand-main {
            font-family: 'Oswald', sans-serif;
            font-size: 3.5em;
            color: #F5C518;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(245, 197, 24, 0.4);
            font-weight: 700;
        }

        .brand-sub {
            font-family: 'Segoe UI', sans-serif;
            font-size: 1.2em;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 12px;
            margin-top: 5px;
            font-weight: 300;
            text-align: center;
            margin-left: 5px;
            /* Visual centering adjustment */
        }

        .tagline {
            font-size: 1.3em;
            color: #ccc;
            margin-bottom: 30px;
            font-weight: 300;
            letter-spacing: 1px;
            font-style: italic;
            border-bottom: 1px solid #333;
            padding-bottom: 25px;
            display: inline-block;
            margin-top: 20px;
        }

        p {
            color: #aaa;
            line-height: 1.6;
            font-size: 1.1em;
        }

        .cta {
            margin-top: 40px;
        }

        .cta a {
            background: #F5C518;
            color: #000;
            text-decoration: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.2em;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(245, 197, 24, 0.4);
            display: inline-block;
        }

        .cta a:hover {
            background: #ffd700;
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 6px 20px rgba(245, 197, 24, 0.7);
            color: #000;
        }
    </style>
</head>

<body>
    <div class="container">
        {% block content %}
        <div class="logo-container">
            <img src="{{ url_for('static', filename='batverse_logo.svg') }}" alt="BatVerse Logo" class="bat-logo">
            <div class="brand-text">
                <span class="brand-main">BATVERSE</span>
                <span class="brand-sub">CINEMAS</span>
            </div>
        </div>
        <p class="tagline">“Born in the Dark. Shown in Brilliance.”</p>
        <p>Book your favorite movies, choose your Knight Seats, and enjoy the show.<br>Fast, easy, and secure.</p>
        <div class="cta">
            <a href="/movies">View Movies & Book Now</a>
        </div>
        {% endblock %}
    </div>
</body>

</html>
