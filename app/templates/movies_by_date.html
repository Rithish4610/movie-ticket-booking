<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies by Date | Movie Ticket Booking</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #121212;
            color: #e0e0e0;
            margin: 0;
        }

        .container {
            max-width: 700px;
            margin: 60px auto;
            background: #1e1e1e;
            border-radius: 18px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
            padding: 40px 32px 32px 32px;
            border: 1px solid #333;
        }

        h2 {
            color: #F5C518;
            text-align: center;
            text-shadow: 0 0 10px rgba(245, 197, 24, 0.3);
        }

        .movie {
            background: #2c2c2c;
            border-radius: 10px;
            padding: 18px 24px;
            margin-bottom: 18px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            border: 1px solid #444;
        }

        .movie-title {
            font-size: 1.3em;
            color: #F5C518;
        }

        .showtimes {
            margin-top: 8px;
            color: #aaa;
        }

        a {
            color: #F5C518;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .showtime-box {
            display: inline-block;
            background: #333;
            border: 2px solid #F5C518;
            border-radius: 8px;
            padding: 8px 18px;
            font-weight: bold;
            color: #F5C518;
            min-width: 90px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            transition: all 0.2s;
        }

        .showtime-box:hover,
        .showtime-box:focus {
            box-shadow: 0 0 16px 4px rgba(245, 197, 24, 0.4);
            border-color: #ffd700;
            background: #444;
            color: #ffd700;
            outline: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Movies on {{ date }}</h2>
        <a href="/movies">&#8592; Back to Dates</a>
        {% if movies_dict %}
        {% for movie_title, shows in movies_dict.items() %}
        <div class="movie">
            <div class="movie-title">{{ movie_title }}</div>
            <div class="showtimes" style="display:flex; flex-wrap:wrap; gap:12px; margin-top:10px;">
                {% for show in shows %}
                <a href="/book/{{ show.id }}" style="text-decoration:none;">
                    <span class="showtime-box" tabindex="0">{{ show.show_time.strftime('%I:%M %p') }}</span>
                </a>
                {% endfor %}
            </div>
        </div>
        {% endfor %}
        {% else %}
        <p>No shows available for this date.</p>
        {% endif %}
    </div>
</body>

</html>
