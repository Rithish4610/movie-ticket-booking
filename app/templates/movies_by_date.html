<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies by Date | Movie Ticket Booking</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f6f8fc;
            color: #222;
            margin: 0;
        }
        .container {
            max-width: 700px;
            margin: 60px auto;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 4px 24px #b3c6e0aa;
            padding: 40px 32px 32px 32px;
        }
        h2 {
            color: #3b82f6;
            text-align: center;
        }
        .movie {
            background: #e3eaff;
            border-radius: 10px;
            padding: 18px 24px;
            margin-bottom: 18px;
            box-shadow: 0 2px 8px #b3c6e066;
        }
        .movie-title {
            font-size: 1.3em;
            color: #3b82f6;
        }
        .showtimes {
            margin-top: 8px;
            color: #7b8fa6;
        }
        a {
            color: #3b82f6;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .showtime-box {
            display: inline-block;
            background: #e3eaff;
            border: 2px solid #3b82f6;
            border-radius: 8px;
            padding: 8px 18px;
            font-weight: bold;
            color: #3b82f6;
            min-width: 90px;
            text-align: center;
            box-shadow: 0 2px 8px #b3c6e066;
            cursor: pointer;
            transition: box-shadow 0.2s, border-color 0.2s;
        }
        .showtime-box:hover, .showtime-box:focus {
            box-shadow: 0 0 16px 4px #3b82f6cc, 0 2px 8px #b3c6e066;
            border-color: #2563eb;
            outline: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Movies on {{ date }}</h2>
        <a href="/movies">&#8592; Back to Dates</a>
        {% if movies_dict %}
            {% for movie_title, shows in movies_dict.items() %}
                <div class="movie">
                    <div class="movie-title">{{ movie_title }}</div>
                    <div class="showtimes" style="display:flex; flex-wrap:wrap; gap:12px; margin-top:10px;">
                        {% for show in shows %}
                            <a href="/book/{{ show.id }}" style="text-decoration:none;">
                                <span class="showtime-box" tabindex="0">{{ show.show_time.strftime('%I:%M %p') }}</span>
                            </a>
                        {% endfor %}
                    </div>
                </div>
            {% endfor %}
        {% else %}
            <p>No shows available for this date.</p>
        {% endif %}
    </div>
</body>
</html>
