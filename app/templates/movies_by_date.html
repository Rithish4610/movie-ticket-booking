<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies by Date | Movie Ticket Booking</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #fdf6f0;
            color: #222;
            margin: 0;
        }
        .container {
            max-width: 700px;
            margin: 60px auto;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 4px 24px #f7c8e0aa;
            padding: 40px 32px 32px 32px;
        }
        h2 {
            color: #e75480;
            text-align: center;
        }
        .movie {
            background: #fce4ec;
            border-radius: 10px;
            padding: 18px 24px;
            margin-bottom: 18px;
            box-shadow: 0 2px 8px #f7c8e066;
        }
        .movie-title {
            font-size: 1.3em;
            color: #e75480;
        }
        .showtimes {
            margin-top: 8px;
            color: #a78bfa;
        }
        a {
            color: #e75480;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Movies on {{ date }}</h2>
        <a href="/movies">&#8592; Back to Dates</a>
        {% if movies_dict %}
            {% for movie_title, shows in movies_dict.items() %}
                <div class="movie">
                    <div class="movie-title">{{ movie_title }}</div>
                    <div class="showtimes" style="display:flex; flex-wrap:wrap; gap:12px; margin-top:10px;">
                        {% for show in shows %}
                            <a href="/book/{{ show.id }}" style="text-decoration:none;">
                                <span style="display:inline-block; background:#232a34; border:2px solid #ffb347; border-radius:8px; padding:8px 18px; font-weight:bold; color:#ffb347; min-width:90px; text-align:center; box-shadow:0 2px 8px #0002; cursor:pointer;">{{ show.show_time.strftime('%I:%M %p') }}</span>
                            </a>
                        {% endfor %}
                    </div>
                </div>
            {% endfor %}
        {% else %}
            <p>No shows available for this date.</p>
        {% endif %}
    </div>
</body>
</html>
