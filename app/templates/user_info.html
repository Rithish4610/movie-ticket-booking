<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Information | Movie Ticket Booking</title>
    <style>
        body { font-family: Arial, sans-serif; background: #181c24; color: #fff; margin: 0; }
        .container { max-width: 500px; margin: 60px auto; background: #232a34; border-radius: 12px; box-shadow: 0 4px 24px #0003; padding: 32px; }
        h2 { color: #ffb347; text-align: center; }
        label { display: block; margin: 18px 0 6px; color: #b3e6ff; font-weight: bold; }
        input[type="text"], input[type="email"], input[type="tel"] { width: 100%; padding: 10px; border-radius: 6px; border: none; margin-bottom: 16px; }
        button { background: #ffb347; color: #232a34; border: none; padding: 12px 32px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.2s; width: 100%; }
        button:hover { background: #ff8800; }
        .seats-list { color: #b3e6ff; margin-bottom: 18px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Enter Your Information</h2>
        <div class="seats-list">
            <strong>Selected Seats:</strong> {{ seat_display_str }}<br>
            <strong>Movie:</strong> {{ movie.title }}<br>
            <strong>Show Time:</strong> {{ show.show_time.strftime('%d %b %Y, %I:%M %p') }}
        </div>
        <form method="POST">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" required pattern="[0-9]{10,15}">
            <button type="submit">Continue to Payment</button>
        </form>
    </div>
</body>
</html>
