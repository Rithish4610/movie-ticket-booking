<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Add Movie</title>
    <style>
        body { font-family: Arial, sans-serif; background: #181c24; color: #fff; margin: 0; }
        .container { max-width: 500px; margin: 60px auto; background: #232a34; border-radius: 12px; box-shadow: 0 4px 24px #0003; padding: 32px; text-align: center; }
        h2 { color: #ffb347; }
        label { display: block; margin: 18px 0 6px; text-align: left; }
        input, textarea { width: 100%; padding: 10px; border-radius: 6px; border: none; margin-bottom: 16px; background: #2d3642; color: #fff; }
        button { background: #ffb347; color: #232a34; border: none; padding: 12px 32px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #ff8800; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Add New Movie</h2>
        <form method="POST" id="add-movie-form">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" required>
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="4"></textarea>
            <label for="show_date">Show Date</label>
            <input type="date" id="show_date" name="show_date" required>
            <label for="num_shows">Number of Shows</label>
            <select id="num_shows" name="num_shows" required>
                {% for i in range(1, 9) %}
                <option value="{{ i }}">{{ i }}</option>
                {% endfor %}
            </select>
            <div id="show-times-container"></div>
            <label for="ticket_price">Ticket Price (₹)</label>
            <input type="number" id="ticket_price" name="ticket_price" min="0" step="0.01" required>
            <button type="submit">Add Movie</button>
        </form>
        <script>
        const numShowsSelect = document.getElementById('num_shows');
        const showTimesContainer = document.getElementById('show-times-container');
        function renderShowTimeInputs() {
            const num = parseInt(numShowsSelect.value);
            showTimesContainer.innerHTML = '';
            for (let i = 1; i <= num; i++) {
                const label = document.createElement('label');
                label.textContent = `Show ${i} Time`;
                label.setAttribute('for', `show_time_${i}`);
                showTimesContainer.appendChild(label);
                const input = document.createElement('input');
                input.type = 'time';
                input.id = `show_time_${i}`;
                input.name = `show_time_${i}`;
                input.required = true;
                showTimesContainer.appendChild(input);
            }
        }
        numShowsSelect.addEventListener('change', renderShowTimeInputs);
        window.addEventListener('DOMContentLoaded', renderShowTimeInputs);
        </script>
    </div>
</body>
</html>
