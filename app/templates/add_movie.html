<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Add Movie</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f6f8fc;
            color: #222;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 60px auto;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 4px 24px #b3c6e0aa;
            padding: 40px 32px 32px 32px;
            text-align: center;
        }
        h2 {
            color: #3b82f6;
        }
        label {
            display: block;
            margin: 18px 0 6px;
            text-align: left;
            color: #7b8fa6;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #e3eaff;
            margin-bottom: 16px;
            background: #e3eaff;
            color: #222;
        }
        button {
            background: linear-gradient(90deg, #3b82f6 0%, #a7e9af 100%);
            color: #fff;
            border: none;
            padding: 12px 32px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 1.1em;
            box-shadow: 0 2px 8px #b3c6e066;
        }
        button:hover {
            background: linear-gradient(90deg, #2563eb 0%, #7ed957 100%);
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Add New Movie</h2>
        <form method="POST" id="add-movie-form">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" required>
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="4"></textarea>
            <label for="show_date">Show Date</label>
            <input type="date" id="show_date" name="show_date" required>
            <script>
            // Set min date to today
            document.addEventListener('DOMContentLoaded', function() {
                var today = new Date();
                var yyyy = today.getFullYear();
                var mm = String(today.getMonth() + 1).padStart(2, '0');
                var dd = String(today.getDate()).padStart(2, '0');
                var minDate = yyyy + '-' + mm + '-' + dd;
                document.getElementById('show_date').setAttribute('min', minDate);
            });
            </script>
            <label for="num_shows">Number of Shows</label>
            <select id="num_shows" name="num_shows" required>
                {% for i in range(1, 9) %}
                <option value="{{ i }}">{{ i }}</option>
                {% endfor %}
            </select>
            <div id="show-times-container"></div>
            <label>Ticket Price</label>
            <label for="ticket_price_first">First Class (₹)</label>
            <input type="number" id="ticket_price_first" name="ticket_price_first" min="0" step="0.01" required>
            <label for="ticket_price_second">Second Class (₹)</label>
            <input type="number" id="ticket_price_second" name="ticket_price_second" min="0" step="0.01" required>
            <button type="submit">Add Movie</button>
        </form>
        <script>
        const numShowsSelect = document.getElementById('num_shows');
        const showTimesContainer = document.getElementById('show-times-container');
        function renderShowTimeInputs() {
            const num = parseInt(numShowsSelect.value);
            showTimesContainer.innerHTML = '';
            for (let i = 1; i <= num; i++) {
                const label = document.createElement('label');
                label.textContent = `Show ${i} Time`;
                label.setAttribute('for', `show_time_${i}`);
                showTimesContainer.appendChild(label);
                const input = document.createElement('input');
                input.type = 'time';
                input.id = `show_time_${i}`;
                input.name = `show_time_${i}`;
                input.required = true;
                showTimesContainer.appendChild(input);
            }
        }
        numShowsSelect.addEventListener('change', renderShowTimeInputs);
        window.addEventListener('DOMContentLoaded', renderShowTimeInputs);
        </script>
    </div>
</body>
</html>
